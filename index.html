<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品組み合わせ計算</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head><body><main><header><small>PRODUCT COMBINATION CALCULATOR</small><h1>商品組み合わせ計算</h1><p>目標金額に合わせて、購入数量を自動提案します。</p></header><section><h2>01　計算条件</h2><div class="fields"><label>目標金額（円）<input id="target" type="number" min="1" value="112195"></label><label>最小プラス差額（円）<input id="low" type="number" min="0" value="300"></label><label>最大プラス差額（円）<input id="high" type="number" min="0" value="500"></label></div><label class="check"><input type="checkbox" id="all" checked> 全商品を1個以上使用する</label></section><section><h2>02　商品設定</h2><div class="scroll"><table><thead><tr><th>商品名</th><th>単価（円）</th><th>最小数</th><th>最大数</th><th></th></tr></thead><tbody id="items"></tbody></table></div><p class="hint">最大数が空欄の場合は金額から自動設定します。設定はこのブラウザに保存されます。</p><div class="actions"><button id="add" class="secondary">＋ 商品追加</button><button id="reset" class="secondary">初期設定に戻す</button></div></section><button id="run" class="primary">3パターンを計算する</button><p id="status" role="status" aria-live="polite"></p><div id="results"></div></main></body></html>
